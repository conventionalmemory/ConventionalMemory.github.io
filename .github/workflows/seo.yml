name: Rebuild search pages
on:
  push:
    branches: [main]
    paths: [timeline-data.js, timeline-extra.js, timeline-edits.js, items.js, affiliate.js, gear.js, draftfilter.js, books.js, cast.js, pages.js, recap-data.js, schematic.js, schematic-data.js, ipod-data.js, ipodbench.js, kits-data.js, library-data.js, libmap-data.js, repairs-data.js, tools/build-seo.js, tools/guides.js, CNAME]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: node tools/build-seo.js
      - name: Commit the search pages if they changed
        run: |
          git config user.name "seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add -A history year decade museum guides books cast features recap repairs ipod sitemap.xml robots.txt 404.html
          git diff --cached --quiet || (git commit -m "Rebuild search pages" && git pull --rebase origin main && git push)
      - name: Tell Bing and other IndexNow engines (give GitHub Pages a minute to publish first)
        run: |
          sleep 90
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then node tools/indexnow.js --all; else node tools/indexnow.js; fi
        continue-on-error: true
