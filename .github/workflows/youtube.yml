name: Refresh YouTube videos
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: node tools/build-youtube.js
      - name: Commit youtube-data.js if it changed
        run: |
          git config user.name "youtube-bot"
          git config user.email "youtube-bot@users.noreply.github.com"
          git add youtube-data.js
          git diff --cached --quiet || (git commit -m "Refresh YouTube videos" && git pull --rebase origin main && git push)
