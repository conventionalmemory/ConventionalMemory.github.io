name: Rebuild RSS feed
on:
  push:
    branches: [main]
    paths: [items.js, tools/build-feed.js]
permissions:
  contents: write
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/build-feed.js
      - name: Commit feed.xml if it changed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add feed.xml
          git diff --cached --quiet || (git commit -m "Rebuild feed.xml" && git push)
