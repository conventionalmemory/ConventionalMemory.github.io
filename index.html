<style>

:root[data-theme="dark"]{--bg:#0d1230;--panel:#161c44;--ink:#eceefb;--mute:#a4a9d0;--blue:#55ffff;--blue-ink:#0d1230;--line:#eceefb}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "IBM Plex Sans",system-ui,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}

a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
header.top{padding:18px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.hero{padding:28px 0 36px}

.mem{margin-top:26px;border:2px solid var(--line);background:var(--panel);padding:10px}

.btn{display:inline-block;padding:10px 16px;border:2px solid var(--line);background:var(--panel);text-decoration:none;font-weight:600;font-size:15px}
.btn:hover,.btn.pri{background:var(--blue);color:var(--blue-ink)}
section{padding:24px 0}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 18px}
input,select{font:inherit;padding:9px 12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);min-width:0}
input{flex:1 1 200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{display:block;text-decoration:none;border:2px solid var(--line);background:var(--panel)}
.card:hover{border-color:var(--blue);box-shadow:4px 4px 0 var(--blue)}
.ph{aspect-ratio:4/3;display:grid;place-items:center;background:var(--bg);border-bottom:2px solid var(--line);font-family:"VT323",monospace;font-size:22px;color:var(--mute);overflow:hidden}

.card div.t{padding:10px 12px}

.tag{font-size:12px;border:1px solid var(--mute);padding:1px 6px;color:var(--mute);margin-left:6px}
.detail{display:grid;gap:22px}

.detail .ph{border:2px solid var(--line);font-size:28px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:16px 0}
dt{color:var(--mute)}dd{margin:0}
.score{margin:14px 0}.score b{font-family:"VT323",monospace;font-size:28px;font-weight:400;margin-right:8px}.score span{color:var(--mute)}
.src{border:2px solid var(--line);background:var(--panel);padding:12px 14px;margin:16px 0}.src small{display:block;color:var(--mute);margin-top:6px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}.gal .ph{cursor:zoom-in;font-size:18px}
.aud{margin:10px 0}.aud audio{width:100%}.aud span{display:block;font-size:14px;color:var(--mute)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:grid;place-items:center;z-index:9;cursor:zoom-out;padding:16px}.lb img{max-width:100%;max-height:100%}
.score .bar{background:repeating-linear-gradient(90deg,transparent 0 calc(15.625% - 2px),var(--line) calc(15.625% - 2px) 15.625%)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stats div{border:2px solid var(--line);background:var(--panel);padding:10px 12px;color:var(--mute);font-size:14px}

.tl{margin:4px 0}.tl b{font-family:"VT323",monospace;font-size:24px;font-weight:400;margin-right:8px}
.pn{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:15px}
.bld label{display:block;font-size:14px;color:var(--mute);margin-top:10px}.bld input,.bld select,.bld textarea{width:100%;display:block}
.bld fieldset{border:2px solid var(--line);margin:16px 0;padding:6px 14px 14px}.bld legend{font-family:"VT323",monospace;font-size:24px;padding:0 6px}
.bld textarea{font:14px/1.4 monospace;min-height:220px;background:var(--panel);color:var(--ink);border:2px solid var(--line);padding:10px}
button.btn{font-family:inherit;color:var(--ink);cursor:pointer;padding:4px 10px}
:root[data-theme="green"]{--bg:#031403;--panel:#082408;--ink:#4dff6e;--mute:#2fb84a;--blue:#4dff6e;--blue-ink:#031403;--line:#2fb84a}

:root[data-theme="green"] body::after,:root[data-theme="amber"] body::after,:root[data-theme="ega"] body::after{background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}

.dlg{max-width:480px;margin:30px auto;border:2px solid var(--line);background:var(--panel);box-shadow:6px 6px 0 var(--line)}.dlg .tb{margin:0}.dlg p{padding:0 14px}
.scr{overflow-x:auto;border:2px solid var(--line);background:var(--panel);padding:12px}.dir{font:15px/1.35 "Courier New",monospace;margin:0}
.boot{position:fixed;inset:0;z-index:20;background:#000;color:#c8c8c8;font:24px/1.3 "VT323","Courier New",monospace;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 20px;cursor:pointer}
.boot pre{margin:0;white-space:pre-wrap;font:inherit}.boot p{margin-top:24px;color:#777}

.cmp.df{background:color-mix(in srgb,var(--blue) 14%,transparent)}.cmph b{font-family:"VT323",monospace;font-size:24px;font-weight:400}
.tl.g,.tl.p{border-left:3px solid var(--mute);padding-left:8px}.tl.g{border-color:var(--blue)}
.qt{margin:12px 0;padding:10px 14px;border-left:4px solid var(--blue);background:var(--panel)}.qt p{margin:0;font-size:1.05em}.qa{margin-top:6px;color:var(--mute);font-family:"VT323",monospace;font-size:20px}
.cl{padding:5px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 25%,transparent)}.cl b{font-family:"VT323",monospace;font-size:22px;font-weight:400;margin-right:8px}
.ex{padding:4px 0}.tn{color:var(--mute)}
.tag.want{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}.tag.pr{border-color:var(--ink);color:var(--ink)}
.tl b{display:inline-block;min-width:96px}.tl.gt,.tl.i,.tl.hw{border-left:3px solid var(--blue);padding-left:8px}.tl.w,.tl.u{color:var(--mute)}
.tl.e{border-left:3px solid var(--mute);padding-left:8px;font-weight:600}.ast{color:var(--mute);cursor:help}
.ad{margin:10px 0;padding:10px 12px;border:2px dashed var(--line);background:var(--panel)}.ad b.adh{font-family:"VT323",monospace;font-size:24px;font-weight:400}.ad p{margin:2px 0}

.gm{background:#000;color:#fff;border:3px solid #aaa;padding:0;margin:8px 0}.gm h2{color:#ff5;margin:0 0 6px}
.gbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:#aaa;color:#000;padding:4px 10px;font-family:"VT323",monospace;font-size:22px}.gbar b{color:#00a}
.gmemw{margin-left:auto;display:inline-flex;align-items:center;gap:6px}.gmemw .bar{display:inline-block;width:90px;height:12px;background:#555;border:1px solid #000;padding:0}.gmemw .bar i{display:block;height:100%;background:#5f5;width:100%}

.gm .btn{background:#aaa;color:#000;border:2px solid #fff;border-right-color:#555;border-bottom-color:#555;text-align:left;font-family:inherit}.gm .btn:hover,.gm .btn:focus{background:#ff5;outline:2px solid #fff}.gm .btn.pri{background:#5f5}

.gsel{padding:12px 14px}.gchars{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0}.gchar{background:#00a;color:#fff;border:3px solid #aaa;padding:10px;text-align:center;cursor:pointer;font:inherit}.gchar:hover,.gchar:focus{border-color:#ff5}.gchar b{display:block;font-family:"VT323",monospace;font-size:28px;color:#ff5}.gchar span{display:block;font-size:14px}.gchar canvas{image-rendering:pixelated}
